<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%232457D6' stroke-width='9'/><circle cx='50' cy='16' r='11' fill='%230B8A7E'/></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body data-tab="today">
<div class="shell">
  <nav class="rail" aria-label="Sections">
    <div class="brand">Daily Hub<small>Job search desk</small></div>
    <div class="nav" id="nav">
      <button data-tab="today">Today <span class="count" id="c-today"></span></button>
      <button data-tab="search">Active Jobs and Search</button>
      <button data-tab="records">Records <span class="count" id="c-records"></span></button>
      <button data-tab="goals">Goals and Next Steps</button>
      <button data-tab="networking">Networking</button>
      <button data-tab="resources">Employers and Resources</button>
      <button data-tab="process">How it works</button>
      <button data-tab="errors">Error log <span class="count" id="c-errors"></span></button>
    </div>
    <div class="rail-foot" id="railfoot"></div>
  </nav>
  <main>
    <section class="view" id="v-today" hidden></section>
    <section class="view" id="v-search" hidden></section>
    <section class="view" id="v-records" hidden></section>
    <section class="view" id="v-goals" hidden></section>
    <section class="view" id="v-networking" hidden></section>
    <section class="view" id="v-resources" hidden></section>
    <section class="view" id="v-process" hidden></section>
    <section class="view" id="v-errors" hidden></section>
  </main>
</div>
<div id="layer"></div>
<script src="app.js"></script>
<script src="views.js"></script>
<script>boot();</script>
</body>
</html>
